<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Lab Requests</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap');
:root{
  --dk:#15543C; --dk2:#0E3E2C;
  --g:#2EA94E; --g2:#27913F; --gsoft:#E9F6ED; --gline:#CFE8D8; --gink:#1E7A3D;
  --r:#E5484D; --rsoft:#FDECEC; --rline:#F6CFCF; --rink:#C2312F;
  --o:#F0601F; --osoft:#FEEFE7;
  --a:#E9A800; --asoft:#FBF3D2;
  --ink:#16221C; --body:#44534B; --mut:#7A8A80; --faint:#A6B2AA;
  --line:#E4EBE7; --hair:#EDF2EF; --bg:#F4F7F5; --card:#FFFFFF;
  --note:#FDF8D2; --anbg:#E6F0EA; --hdr:#DCEAE2; --hdrR:#FBE1DB; --hdrG:#E8F6ED;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
body{font-family:Inter,system-ui,sans-serif;background:#DDE4E0;color:var(--body);font-size:13px;
  -webkit-font-smoothing:antialiased}
svg{display:block}
.el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── shell ── */
.app{display:flex;min-width:1240px;height:100vh;background:var(--bg);overflow:hidden}
.side{width:260px;flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 4px 18px}
.brand .lg{width:34px;height:34px;border-radius:9px;background:var(--dk);display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:15px}
.brand .nm{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:.14em}
.brand .nm i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.42em;color:var(--mut);
  font-weight:600;margin-top:-1px}
.brand .cl{margin-left:auto;color:var(--faint)}
.sbox{display:flex;align-items:center;gap:9px;height:38px;padding:0 11px;border:1px solid var(--line);
  border-radius:9px;color:var(--faint);font-size:13px;margin-bottom:16px}
.sbox svg{width:15px;height:15px}
.sgrp{display:flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.11em;
  color:var(--mut);padding:0 6px 8px}
.sgrp svg{width:14px;height:14px;margin-left:auto}
.nav{display:flex;align-items:center;gap:11px;width:100%;height:42px;padding:0 12px;border-radius:9px;
  font-size:13.5px;color:var(--body);margin-bottom:3px;font-weight:500}
.nav svg{width:17px;height:17px;flex:none}
.nav .ch{margin-left:auto;width:14px;height:14px;color:var(--faint)}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--dk);color:#fff;font-weight:600}
.nav.on .ch{color:rgba(255,255,255,.6)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);
  border-radius:11px}
.me .av{width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;flex:none;background:var(--line)}
.me .n{font-size:13px;font-weight:600;color:var(--ink)}
.me .e{font-size:11px;color:var(--mut)}
.me .ch{margin-left:auto;color:var(--faint)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:14px;padding:14px 26px}
.labsel{display:flex;align-items:center;gap:11px;height:52px;padding:0 14px;background:#fff;
  border:1px solid var(--line);border-radius:11px;min-width:238px}
.labsel .ic{width:26px;height:26px;color:var(--dk)}
.labsel .n{font-size:14px;font-weight:700;color:var(--ink)}
.labsel .s{font-size:11px;color:var(--mut)}
.labsel .ch{margin-left:auto;color:var(--faint)}
.top .sp{flex:1}
.tic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--body)}
.tic:hover{background:#fff}
.tic svg{width:19px;height:19px}
.crumb{padding:0 26px 14px;font-size:13px;color:var(--mut)}
.crumb b{color:var(--ink);font-weight:500}

.panel{flex:1;margin:0 26px 22px;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(22,34,28,.05),
  0 18px 40px -30px rgba(22,34,28,.5);display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;padding:22px 24px 0}
.ph h1{font-size:23px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.dl{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--gink);font-size:13.5px;
  font-weight:600}
.dl svg{width:17px;height:17px}
.ctl{display:flex;align-items:center;gap:14px;padding:16px 24px 0}
.chipd{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;background:var(--bg);
  border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.chipd svg{width:16px;height:16px;color:var(--mut)}
.nonan{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--body)}
.badge{min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--a);color:#fff;
  font-size:11.5px;font-weight:800;display:grid;place-items:center}
.tog{width:38px;height:21px;border-radius:99px;background:var(--line);position:relative;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .18s}
.tog.on{background:var(--g)} .tog.on i{left:20px}
.ctl .sp{flex:1}
.srchb{display:flex;align-items:center;gap:9px;width:240px;height:40px;padding:0 12px;
  border:1px solid var(--line);border-radius:9px;color:var(--faint);font-size:13px}
.srchb svg{width:15px;height:15px}
.fbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 15px;border:1px solid var(--line);
  border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.fbtn svg{width:16px;height:16px}

.tabs{display:flex;align-items:center;gap:26px;padding:16px 24px 0;border-bottom:1px solid var(--line);
  position:relative}
.tab{padding:0 0 12px;font-size:13.5px;color:var(--mut);font-weight:500;position:relative}
.tab.on{color:var(--gink);font-weight:700}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:var(--g);
  border-radius:2px}
.tabs .sp{flex:1}
.legbtn,.qrbtn{display:flex;align-items:center;gap:9px;height:38px;padding:0 13px;border:1px solid var(--line);
  border-radius:9px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:9px}
.qrbtn{padding:0;width:40px;justify-content:center}
.legbtn svg,.qrbtn svg{width:16px;height:16px;color:var(--mut)}
.legbtn.on{border-color:var(--g);color:var(--gink)}

/* ── table ── */
.tw{flex:1;overflow:auto;padding:14px 24px 0}
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;
  overflow:hidden}
.tbl th{background:var(--bg);font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--mut);
  text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#FAFCFB}
.tbl tbody tr.on{background:var(--gsoft)}
.rid{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);font-weight:500;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--r);flex:none}
.ent{display:flex;align-items:center;gap:11px}
.ent .av{width:36px;height:36px;border-radius:9px;overflow:hidden;position:relative;flex:none;
  background:var(--anbg)}
.ent .av.pool{display:grid;place-items:center;color:var(--dk)}
.ent .av.pool svg{width:19px;height:19px}
.ent .n{font-size:14px;font-weight:600;color:var(--ink)}
.ent .s{font-size:11.5px;color:var(--mut);margin-top:1px}
.big{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px}
.pills{display:flex;gap:5px}
.pl{min-width:22px;height:22px;padding:0 6px;border-radius:99px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}
.pl.c{background:var(--g)} .pl.rj{background:var(--r)} .pl.ip{background:var(--a)}
.pl.nc{background:#6B7A72} .pl.z{background:#C8D2CC}
.tp{min-width:24px;height:21px;padding:0 7px;border-radius:5px;display:grid;place-items:center;
  font-size:11px;font-weight:700}
.tp.done{background:#D9F1E0;color:var(--gink)} .tp.prog{background:#FAF0C6;color:#8A6A12}
.tp.pend{background:#EBEFEC;color:var(--body)} .tp.canc{background:#FBDDD9;color:var(--rink)}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;flex:none;background:var(--line)}
.who .n{font-size:13.5px;font-weight:600;color:var(--ink)}
.who .s{font-size:12px;color:var(--mut);margin-top:1px}
.who .d{font-size:11.5px;color:var(--faint);margin-top:2px}
.pfoot{display:flex;align-items:center;padding:16px 24px 20px;font-size:12.5px;color:var(--mut)}
.pg{margin-left:auto;display:flex;align-items:center;gap:6px}
.pg button{min-width:32px;height:32px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--body)}
.pg button.on{background:var(--g);color:#fff;font-weight:700}
.pg button:hover:not(.on){background:var(--bg)}

/* ── legends ── */
.leg{position:absolute;right:24px;top:56px;width:170px;background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:0 12px 34px -12px rgba(22,34,28,.35);padding:14px;z-index:14}
.leg h4{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:9px}
.leg .row{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12px}
.leg .sw{width:11px;height:11px;border-radius:50%;flex:none}
.leg .sq{width:13px;height:13px;border-radius:4px;flex:none}
.leg hr{border:0;border-top:1px solid var(--hair);margin:11px 0}

/* ── side sheet ── */
.scrim{position:fixed;inset:0;background:rgba(14,30,22,.34);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:562px;background:#fff;z-index:31;
  transform:translateX(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 60px -30px rgba(14,30,22,.6)}
.sheet.on{transform:none}
.shh{flex:none;padding:20px 22px 14px}
.shh .st{font-size:15px;font-weight:700;color:var(--o)}
.shh .x{position:absolute;top:18px;right:20px;width:30px;height:30px;display:grid;place-items:center;
  color:var(--body)}
.shh .x svg{width:19px;height:19px}
.shh .id{display:flex;align-items:center;gap:9px;margin-top:5px}
.shh .id .fl{width:24px;height:24px;border-radius:50%;background:var(--o);display:grid;place-items:center}
.shh .id .fl svg{width:14px;height:14px;color:#fff}
.shh .id h3{font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.shh .med{font-size:13.5px;color:var(--ink);margin-top:4px;font-weight:500}
.shh .by{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--body)}
.shh .by .av{width:19px;height:19px;border-radius:50%;overflow:hidden;position:relative;background:var(--line)}
.shh .by .site{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--body)}
.shh .by .site svg{width:14px;height:14px;color:var(--mut)}
.anbox{flex:none;display:flex;gap:12px;padding:14px 22px;background:var(--anbg)}
.anbox .av{width:40px;height:40px;border-radius:9px;overflow:hidden;position:relative;flex:none;background:#fff}
.anbox .mb{width:22px;height:22px;border-radius:6px;background:#CFEFE9;color:#0E7C72;display:grid;
  place-items:center;font-size:11px;font-weight:800;margin-top:6px}
.anbox .aid{font-size:12px;color:var(--body)}
.anbox .nm{font-size:15px;font-weight:700;color:var(--ink);margin-top:1px}
.anbox .sci{font-size:13px;font-style:italic;color:var(--ink);margin-top:2px}
.anbox .l{font-size:12px;color:var(--body);margin-top:3px}
.notebox{flex:none;display:flex;gap:10px;padding:12px 22px;background:var(--note);font-size:12.5px;
  color:#6B5A08;line-height:1.5}
.notebox svg{width:16px;height:16px;flex:none;margin-top:1px;color:#B79A12}
.shtabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
.shtabs button{flex:1;height:48px;font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--mut);
  text-align:center;position:relative}
.shtabs button.on{color:var(--gink)}
.shtabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;
  background:var(--g)}
.shb{flex:1;overflow:auto;background:#fff}
.shb::-webkit-scrollbar{width:8px}
.shb::-webkit-scrollbar-thumb{background:#D5DEDA;border-radius:4px}

.sechd{display:flex;align-items:center;gap:10px;padding:16px 22px 4px}
.sechd .ic{width:20px;height:20px;color:var(--dk)}
.sechd h4{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.015em}
.cnt2{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;
  background:var(--bg);font-size:12.5px;font-weight:700;color:var(--ink)}
.cnt2 svg{width:12px;height:12px;color:var(--mut)}
.sechd .kebab{margin-left:auto;width:28px;height:28px;display:grid;place-items:center;color:var(--body)}
.sechd .kebab svg{width:17px;height:17px}
.subline{padding:5px 22px 0;font-size:12.5px;color:var(--body)}
.subline b{font-weight:600}
.subline .g{color:var(--gink);font-weight:600} .subline .r{color:var(--rink);font-weight:600}
.shsearch{display:flex;gap:10px;padding:13px 22px 0}
.shsearch .f{flex:1;display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;
  border:1px solid var(--line);border-radius:9px;color:var(--faint);font-size:13px}
.shsearch .f svg{width:15px;height:15px}
.shsearch .fb{position:relative;width:44px;height:40px;border:1px solid var(--line);border-radius:9px;
  display:grid;place-items:center;color:var(--body)}
.shsearch .fb svg{width:17px;height:17px}
.shsearch .fb .b{position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;
  background:var(--g);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.selrow{display:flex;align-items:center;padding:12px 22px 0}
.selrow .lnk{margin-left:auto;font-size:13px;font-weight:700;color:var(--gink)}
.reqbar{display:flex;align-items:center;gap:11px;margin:12px 22px 0;padding:12px 13px;border-radius:10px;
  background:var(--rsoft)}
.reqbar .ic{width:30px;height:30px;border-radius:50%;background:var(--r);display:grid;place-items:center}
.reqbar .ic svg{width:16px;height:16px;color:#fff}
.reqbar .t{font-size:13.5px;font-weight:700;color:var(--ink)}
.reqbar .s{font-size:12px;color:var(--body);margin-top:1px}
.reqbar .n{margin-left:auto;min-width:30px;height:26px;padding:0 8px;border-radius:6px;background:var(--r);
  color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center}
.selbar{display:flex;align-items:center;gap:12px;padding:13px 22px 0;font-size:13px}
.selbar .all{display:flex;align-items:center;gap:8px;color:var(--gink);font-weight:700}
.selbar .all svg{width:16px;height:16px}
.selbar .mid{color:var(--body)}
.selbar .cancel{margin-left:auto;color:var(--body);font-weight:600}

/* ── sample cards ── */
.samples{padding:12px 22px 20px;display:flex;flex-direction:column;gap:13px}
.sc{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.sc.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.sc .hd{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--hdr)}
.sc.rej .hd{background:var(--hdrR)} .sc.done .hd{background:var(--hdrG)}
.sc .hd .n{font-size:14.5px;font-weight:700;color:var(--ink)}
.sc .hd .t{font-size:12px;color:var(--body);margin-top:2px;display:flex;align-items:center;gap:3px}
.sc .hd .t svg{width:12px;height:12px}
.sc .hd .rq{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;
  color:var(--o)}
.sc .hd .rq svg{width:13px;height:13px}
.sc .hd .kebab{width:26px;height:26px;display:grid;place-items:center;color:var(--body);margin-left:auto}
.sc .hd .rq + .kebab{margin-left:8px}
.sc .hd .kebab svg{width:16px;height:16px}
.bcrow{display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fff;border-top:1px solid var(--hair)}
.bcrow:first-of-type{border-top:0}
.bcrow.ok{background:#F6FCF8} .bcrow.no{background:#FEF7F6}
.bcrow .mid{flex:1;min-width:0}
.bcrow .bc{font-size:13.5px;color:var(--ink);font-weight:500}
.bcrow.ok .bc,.bcrow.no .bc{font-weight:600}
.bcrow .st{font-size:11.5px;color:var(--mut);margin-top:2px}
.bcrow.ok .st{color:var(--gink);font-weight:600}
.bcrow.no .st{color:var(--rink);font-weight:600}
.bcrow .mk{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center}
.bcrow .mk.ok{background:var(--g)} .bcrow .mk.no{background:var(--r)}
.bcrow .mk svg{width:11px;height:11px;color:#fff}
.resub{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;color:var(--o);
  background:var(--osoft);padding:3px 8px;border-radius:5px}
.acts{display:flex;gap:9px;flex:none}
.bt{height:34px;padding:0 18px;border-radius:8px;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.bt.rej{border:1px solid var(--rline);color:var(--r);background:#fff}
.bt.rej:hover{background:var(--rsoft)}
.bt.col{background:var(--g);color:#fff}
.bt.col:hover{background:var(--g2)}
.rev{width:30px;height:30px;display:grid;place-items:center;color:var(--mut);flex:none}
.rev svg{width:17px;height:17px}
.cbx{width:19px;height:19px;border-radius:5px;border:1.8px solid var(--line);background:#fff;flex:none;
  display:grid;place-items:center}
.cbx svg{width:12px;height:12px;color:#fff}
.cbx.on{background:var(--g);border-color:var(--g)}
.shf{flex:none;display:flex;gap:12px;padding:14px 22px;border-top:1px solid var(--line);background:#fff}
.shf .bt{flex:1;height:46px;font-size:14px;font-weight:700;letter-spacing:.04em}

/* ── kebab menu ── */
.menu{position:fixed;z-index:34;width:216px;background:#fff;border-radius:10px;
  box-shadow:0 14px 40px -10px rgba(22,34,28,.4);padding:6px;border:1px solid var(--line)}
.menu button{display:block;width:100%;padding:11px 12px;border-radius:7px;font-size:13.5px;color:var(--ink)}
.menu button:hover{background:var(--gsoft);color:var(--gink);font-weight:600}

/* ── modal ── */
.mscrim{position:fixed;inset:0;background:rgba(14,30,22,.45);z-index:40;display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.mscrim.on{opacity:1;pointer-events:auto}
.modal{width:562px;background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(14,30,22,.6);transform:translateY(10px) scale(.99);
  transition:transform .22s cubic-bezier(.22,1,.36,1)}
.mscrim.on .modal{transform:none}
.mh{display:flex;align-items:flex-start;padding:22px 24px 18px;border-bottom:1px solid var(--line)}

/* ── the states the field can hand over · a default type ALWAYS exists ── */
function variant(kind){
  const S4=freshSamples();
  if(kind==='full')return S4;
  if(kind==='noBarcodes'){                     /* type + count, nothing scanned */
    S4.forEach(s=>s.groups.forEach(g=>g.cs.forEach(c=>{c.bc=null;c.st=null;delete c.why})));
    return S4;}
  if(kind==='partial'){                        /* some scanned, some not */
    S4[0].groups[0].cs[1].bc=null;S4[0].groups[0].cs[1].st=null;
    S4[0].groups[1].cs[0].bc=null;S4[0].groups[1].cs[0].st=null;
    S4[1].groups[0].cs[0].bc=null;
    return S4;}
  if(kind==='nothing'||kind==='noTransfer')    /* nothing declared / never sent */
    return S4.map(s=>({...s,groups:[]}));
  return S4;
}

function sampleLine(s){
  const cs=sCs(s),n=cs.length;
  if(!s.groups.length)return 'No containers recorded';
  const types=new Set(s.groups.map(g=>g.t||'?')).size;
  const toScan=cs.filter(c=>!c.bc).length;
  const bits=[`${n} container${n===1?'':'s'}`];
  if(types>1)bits.push(`${types} types`);
  if(toScan)bits.push(`${toScan} to scan`);
  return bits.join(' · ');}

      ${dHead(r)}${dAnimal(r)}${dNote()}${dOverview()}
      <div class="jump"><span class="lbl3" style="margin-right:6px">Jump to</span>
        <button data-jump="secS">Samples · ${S.samples.length}</button>
        <button data-jump="secT">Tests · ${sum(liveT())}</button></div>
      <div class="secA" id="secS">${samplesTab()}</div>${selFoot()}
      <div class="secA" id="secT">${testsTab()}</div></div>`;
  if(S.lv===3)return listCol(rows)+`<div class="dp fixed">
      ${dHead(r)}<div class="inl">${dAnimal(r)}${dNote()}</div>
      <div class="sbs"><div ${keep('s')}>${samplesTab()}${selFoot()}</div><div ${keep('t')}>${testsTab()}</div></div></div>`;
  if(S.lv===4)return listCol(rows)+`<div class="ctx" ${keep('c')}>
      ${dHead(r)}<span class="lbl3">Animal</span><div style="height:8px"></div>${dAnimal(r)}${dNote()}
</div>
      <div class="wk" ${keep('w')}>${dTabs()}${tabBody()}</div>`;
  /* 5 · focus */
  const i=_rows.findIndex(x=>x.no===r.no);
  const nav=`<div class="dh-act"><span class="stepr">Request ${i+1} of ${_rows.length}</span>

function sampleCard(s,i){
  const state=sampleState(s),req=S.requested.includes(s.n);
  const cs=sCs(s);
  const allSel=cs.length&&cs.every(c=>S.sel.has(cKey(i,c)));
  return `<div class="sc ${state} ${S.selMode&&allSel?'sel':''}">
    <div class="hd">
      ${S.selMode&&cs.length?`<button class="cbx ${allSel?'on':''}" data-selall="${i}">${allSel?I.tick:''}</button>`:''}
      <span><span class="n">${esc(s.n)} - ${s.v}</span>
        <span class="t">${s.tests} Tests ${I.chr}</span></span>
      ${req?`<span class="rq">Sample Requested ${I.chr}</span>`:''}
      <button class="kebab" data-menu="card" data-i="${i}">${I.kebab}</button></div>
    <div class="sline2">${sampleLine(s)}</div>
    ${s.groups.length
      ? s.groups.map((g,gi)=>groupBlock(s,i,g,gi)).join('')
      : `<div class="empty2">
          <div class="t">No containers recorded for this sample.</div>
          <div class="s">Nothing has been received yet. Set the container type and how many
            arrived — barcodes can only be printed once the type is known.</div>

            <button class="bt col" data-addtype="${i}">${I.plus2} Add container type</button></div>
        </div>`}
    ${s.groups.length?`<button class="addrow" data-addtype="${i}">${I.plus2} Add container type</button>`:''}
  </div>`;
}
function groupBlock(s,i,g,gi){
  const cs=g.cs.filter(inPkg);
  const toScan=cs.filter(c=>!c.bc).length;
  if(!cs.length)return '';
  return `<div class="grp2">
    <div class="ghd">
      <button class="typebtn" data-type="${i}|${gi}">
        <span class="cap ${capOf(g.t)}"></span>
        <span class="mid"><span class="n">${esc(g.t)} · ${g.vol} ${I.chd}</span>
          <span class="s">${cs.length} container${cs.length===1?'':'s'}${
            toScan?` · ${toScan} to scan`:''}</span></span></button>
      <button class="cntbtn" data-count="${i}|${gi}">${cs.length} ${I.chd}</button>
      ${toScan?`<button class="bt gh sm" data-scan="${i}|${gi}">${I.qr} Scan ${toScan}</button>`:''}
      <button class="kebab" data-menu="group" data-i="${i}" data-g="${gi}">${I.kebab}</button></div>
    ${g.cs.map((c,j)=>inPkg(c)?slotRow(s,i,g,gi,c,j):'').join('')}
  </div>`;
}
const cKey=(i,c)=>i+'|'+c.bc;
function slotRow(s,i,g,gi,c,j){
  const k=`${i}|${gi}|${j}`;
  const sel=S.sel.has(cKey(i,c));
  const judged=c.st==='ok'||c.st==='no';
  return `<div class="bcrow ${c.st==='ok'?'ok':c.st==='no'?'no':''} ${!c.bc?'slot':''}">
    ${S.selMode&&canJudge(c)&&!judged
      ?`<button class="cbx ${sel?'on':''}" data-sel="${cKey(i,c)}">${sel?I.tick:''}</button>`
      :judged?`<span class="mk ${c.st==='ok'?'ok':'no'}">${c.st==='ok'?I.tick:I.x}</span>`:''}
    <span class="mid">
      <span class="bc">${c.bc||`Slot ${j+1} · no barcode`}</span>
      <span class="st">${c.st==='ok'?'Received &amp; accepted':c.st==='no'?'Received &amp; rejected'
        :c.printed?'Printed here · scan to confirm'
        :!c.bc?'Awaiting barcode':S.selMode?'Shipped':esc(c.ship)}
        ${c.why?` · ${esc(c.why)}`:''}</span>
      <span class="tags">
        ${S.resubmitted.has(k)?'<span class="resub">Resubmitted Sample</span>':''}

    ${S.selMode?''

      :`<span class="acts">
          <button class="bt rej" data-reject="${k}">Reject</button>

  </div>`;
}

/* ═══════════ MODAL · CONTAINER ═══════════
   One panel with three modes. A barcode cannot be printed without a container
   type, so type always comes first and print is only ever an exit from here. */
function ctModal(){
  const {i,gi,mode}=S.ct,s=S.samples[i];
  const g=gi>=0?s.groups[gi]:null;
  const sug=SUGGEST[s.n]||['Sterilised Container','30 ml'];
  const t=S.ct.t||(g&&g.t)||sug[0];
  const vol=S.ct.vol||(g&&g.vol)||sug[1];
  const cat=CAT.find(x=>x.t===t)||CAT[0];
  const mapped=g?g.cs.filter(c=>c.bc).length:0;
  const judged=g?g.cs.filter(c=>c.st).length:0;
  const showType=mode!=='count', showCount=mode!=='type';
  const title=mode==='add'?'Add container type':mode==='type'?'Change container type'
    :'How many containers arrived?';
  return `<div class="modal">
    <div class="mh"><div><h3>${title}</h3>
      <div class="s">${esc(s.n)} - ${s.v}${g&&mode!=='add'?` · ${esc(g.t)} · ${g.vol}`:''}</div></div>
      <button class="x" data-act="closeModal">${I.x}</button></div>
    <div class="mb">
      ${showType?`<div class="lbl2">Container type</div>
        <div class="catlist">${CAT.map(c=>`<button class="catrow ${c.t===t?'on':''}"
          data-ct="${esc(c.t)}"><span class="cap ${c.cap}"></span>
          <span class="mid"><span class="n">${c.t}</span><span class="s">${c.add} · ${c.for}</span></span>
          ${c.t===sug[0]?'<span class="tg df">default</span>':''}
          ${c.t===t?`<span class="mk ok">${I.tick}</span>`:''}</button>`).join('')}</div>
        <div class="vols"><span class="lbl">Volume</span>
          ${cat.vols.map(v=>`<button class="volb ${v===vol?'on':''}" data-cv="${v}">${v}</button>`).join('')}
        </div>`:''}

      ${showCount?`<div class="cntbox"><span class="l">How many arrived?</span>
        <span class="stp4"><button data-pq="-1">−</button><b>${S.ct.n}</b>
          <button data-pq="1">+</button></span></div>`:''}

      ${mode==='count'&&g&&S.ct.n<mapped?`<div class="affect red"><span class="ic">${I.warn}</span>
        <span><b>${mapped} barcode${mapped===1?'':'s'} already mapped.</b>
          <span>Lower the count only after removing those barcodes.</span></span></div>`:''}
      ${mode==='count'&&g&&S.ct.n!==g.cs.length&&S.ct.n>=mapped?`<div class="affect amb">
        <span class="ic">${I.warn}</span>
        <span><b>The field recorded ${g.cs.length}.</b>
          <span>Saving ${S.ct.n} makes the lab count the record, and is written to the sample log.</span></span></div>`:''}
      ${mode==='type'&&mapped?`<div class="affect amb"><span class="ic">${I.warn}</span>
        <span><b>${mapped} barcode${mapped===1?'':'s'} stay mapped.</b>
          <span>Stickers are generic — only the recorded type changes.${judged
            ? ` ${judged} already judged, so the tests they serve will re-route.`:''} Logged.</span></span></div>`:''}
      ${showCount?`<div class="mnote">Barcodes carry the container type, so the type has to be set
        before anything can print.</div>`:''}
    </div>
    <div class="mf ${showCount?'row2':''}">
      ${showCount?`<button class="bt gh" data-act="ctSave">SAVE</button>
        <button class="bt col" data-act="ctPrint">${I.printer} SAVE &amp; PRINT ${S.ct.n}</button>`
        :`<button class="bt col" data-act="ctSave">SAVE</button>`}
    </div>
  </div>`;
}

/* ═══════════ MODAL · SCAN CONTAINERS ═══════════ */

  return `<div class="modal wide">
    <div class="mh"><div><h3>Scan containers</h3>

      </div>

      ${S.scanErr?`<div class="affect red"><span class="ic">${I.warn}</span>
        <span><b>${esc(S.scanErr.t)}</b><span>${esc(S.scanErr.d)}</span></span>
        <button class="dis2" data-act="clrScanErr">Dismiss</button></div>`:''}

            <span class="s">${slot>=0?`slot ${slot+1} of ${g.cs.length}`:'all slots filled'}</span></span>
          <span class="rt">${g.cs.filter(c=>c.bc).length}/${g.cs.length}</span></div>`

        ${gi<0&&s.groups.length>1?`<div class="swl2"><span class="lbl">Switch container type</span>

      ${S.pool?`<div class="fld"><label>Animal</label>
        <span class="v">${S.scan.animal||'Asian Lion · 87546/24'}</span>
        <span class="ic" data-act="cycleAnimal">${I.chd}</span></div>`:''}

      ${S.scanLog.length?`<div class="loglist"><div class="lbl">Scanned in this session</div>
        ${S.scanLog.map(x=>`<div class="logrow"><span class="mk ok">${I.tick}</span>
          <span class="mid"><span class="bc">${x.bc}</span>
            <span class="st">${esc(x.to)}</span></span></div>`).join('')}</div>`:''}

function menuHTML(){
  let items;
  if(S.menu.kind==='card'){
    const s=S.samples[S.menu.i],cs=sCs(s);
    items=['Update Sample Status','Add container type'];
    /* nothing received yet → nothing to resubmit */
    if(cs.some(c=>c.st==='no'))items.push('Resubmit Sample');
    items.push('Sample Log');
  } else if(S.menu.kind==='group'){
    const g=S.samples[S.menu.i].groups[S.menu.g];
    const mapped=g.cs.filter(c=>c.bc).length;
    items=[];
    if(g.cs.some(c=>!c.bc))items.push('Scan containers');
    items.push('Change container type','Change count','Print barcodes');
    /* removing a type erases declared containers — only while none are barcoded */
    if(!mapped)items.push('Remove container type');
  } else items=['Request Samples','Bulk Status Update','Export Sample List','Sample Log'];
  return `<div class="menu" style="top:${S.menu.y}px;left:${S.menu.x}px">
    ${items.map(x=>`<button class="${x.startsWith('Remove')?'del':''}"
      data-mi="${esc(x)}">${x}</button>`).join('')}</div>`;
}

/* ═══════════ ACTIONS ═══════════ */
function selectAll(){S.sel=new Set();
  S.samples.forEach((s,i)=>s.groups.forEach(g=>g.cs.forEach(c=>{
    if(inPkg(c)&&canJudge(c)&&!c.st)S.sel.add(cKey(i,c))})));}
function bulk(st){
  let n=0;
  S.samples.forEach((s,i)=>s.groups.forEach(g=>g.cs.forEach(c=>{
    if(S.sel.has(cKey(i,c))&&canJudge(c)){c.st=st;if(st==='no')c.why=S.mReason;n++}})));
  S.sel=new Set();S.selMode=false;return n;
}
const at=(k)=>{const [i,gi,j]=k.split('|').map(Number);
  return {i,gi,j,s:S.samples[i],g:S.samples[i].groups[gi],c:S.samples[i].groups[gi].cs[j]};};
function openScan(i,gi){
  S.scan={i,gi,target:gi>=0?gi:S.samples[i].groups.findIndex(g=>g.cs.some(c=>!c.bc))};
  if(S.scan.target<0)S.scan.target=0;
  S.scanLog=[];S.scanErr=null;
}
function acceptScan(code){
  const {i}=S.scan,s=S.samples[i];
  if(allC().some(c=>c.bc===code)){
    S.scanErr={t:'Barcode already mapped',d:`${code} is already on a container in this request.`};return}
  const gi=S.scan.gi>=0?S.scan.gi:S.scan.target;
  const g=s.groups[gi]; if(!g){S.scanErr={t:'No open slot',d:'Every container here already has a barcode.'};return}
  const j=g.cs.findIndex(c=>!c.bc);
  if(j<0){S.scanErr={t:'No open slot',
    d:`${g.t} already has every barcode mapped. Raise the count, switch type, or add another type.`};return}
  const c=g.cs[j];
  c.bc=code; c.lab=!c.printed||c.printedHere; c.printed=false;
  if(S.pool)c.animal=S.scan.animal||'Asian Lion · 87546/24';
  S.scanLog=[...S.scanLog,{bc:code,to:`${s.n} · ${g.t} · slot ${j+1}`}];
  S.scanErr=null;
}

document.addEventListener('click',e=>{
  const t=e.target;
  const fi=t.closest('.fi');
  if(fi){_cur=fi.dataset.g+'|'+fi.dataset.i;IDX[+fi.dataset.g][1][+fi.dataset.i][1]();
    renderFlows();return}
  if(t.closest('[data-act="toggleFlows"]')){S.flowsMin=!S.flowsMin;renderFlows();return}
  if(t.closest('[data-act2="vmenu"]')){S.vmenu=!S.vmenu;render();return}
  const lvb=t.closest('[data-lv]'); if(lvb){setLV(+lvb.dataset.lv);return}
  const lvs=t.closest('[data-lvstep]'); if(lvs){setLV((S.lv+ +lvs.dataset.lvstep+LV.length)%LV.length);return}
  if(S.vmenu&&!t.closest('.vmenu')){S.vmenu=false;render()}
  const s4=t.closest('[data-sel4]'); if(s4){S.sel4=+s4.dataset.sel4;render();return}
  const g5=t.closest('[data-g5]');
  if(g5){const n=g5.dataset.g5;S.col5.has(n)?S.col5.delete(n):S.col5.add(n);render();return}
  if(S.menu&&!t.closest('.menu')&&!t.closest('[data-menu]')){S.menu=null;render()}

  const mi=t.closest('[data-mi]');
  if(mi){const label=mi.dataset.mi,i=S.menu?S.menu.i:0,gi=S.menu&&S.menu.g!=null?S.menu.g:0;
    S.menu=null;
    const s=S.samples[i];
    if(label==='Update Sample Status'){
      S.modal={i};S.mChips=sCs(s).filter(c=>c.bc&&!c.st).map(c=>c.bc);
      if(!S.mChips.length)S.mChips=sCs(s).filter(c=>c.bc).map(c=>c.bc);
      S.mStatus='Rejected';S.mReason='Sample contaminated';render();
      if(!S.mChips.length)toast('Nothing to update — scan a barcode first');return}
    if(label==='Add container type'){S.ct={i,gi:-1,mode:'add',n:1};render();return}
    if(label==='Change container type'){S.ct={i,gi,mode:'type',n:s.groups[gi].cs.length};render();return}
    if(label==='Change count'){S.ct={i,gi,mode:'count',n:s.groups[gi].cs.length};render();return}
    if(label==='Print barcodes'){S.ct={i,gi,mode:'count',n:s.groups[gi].cs.length};render();return}
    if(label==='Scan containers'){openScan(i,gi);render();return}
    if(label==='Remove container type'){
      const g=s.groups[gi];
      if(g.cs.some(c=>c.bc)){toast('Remove the barcodes first');return}
      s.groups.splice(gi,1);render();toast('Container type removed');return}
    if(label==='Resubmit Sample'){
      if(!S.requested.includes(s.n))S.requested=[...S.requested,s.n];
      s.groups.forEach((g,gx)=>g.cs.forEach((c,j)=>{if(c.st==='no'){c.st=null;c.bc=null;
        delete c.why;S.resubmitted.add(`${i}|${gx}|${j}`)}}));
      render();toast(`${s.n} requested again from the field`);return}
    render();toast(label+' — opens in the full build');return}

  const mn=t.closest('[data-menu]');
  if(mn){const r=mn.getBoundingClientRect();
    S.menu={kind:mn.dataset.menu,i:+(mn.dataset.i||0),g:mn.dataset.g!=null?+mn.dataset.g:null,
      x:Math.min(r.left-190,window.innerWidth-244),y:r.bottom+6};render();return}

  const tb=t.closest('[data-tab]'); if(tb){S.tab=tb.dataset.tab;S.sel4=0;render();return}
  const pk=t.closest('[data-pick]'); if(pk){pickRow(+pk.dataset.pick);return}
  const jm=t.closest('[data-jump]');
  if(jm){const el=document.getElementById(jm.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const stp=t.closest('[data-step]'); if(stp){stepRow(+stp.dataset.step);return}
  if(t.closest('[data-act="rail"]')){S.railOpen=!S.railOpen;render();return}
  const pgb=t.closest('[data-pg]'); if(pgb){S.page=+pgb.dataset.pg;render();return}
  const st2=t.closest('[data-shtab]'); if(st2){S.shTab=st2.dataset.shtab;render();return}
  const dp=t.closest('[data-dept]');
  if(dp){const k=dp.dataset.dept;S.openDept[k]=!S.openDept[k];render();return}
  const pv=t.closest('[data-pkg]'); if(pv){S.pkgView=pv.dataset.pkg;render();return}
  const op=t.closest('[data-open]'); if(op){openSheet();return}

  /* ── accession ── */
  const ad=t.closest('[data-addtype]');
  if(ad){S.ct={i:+ad.dataset.addtype,gi:-1,mode:'add',n:1};render();return}
  const ty=t.closest('[data-type]');
  if(ty){const [i,gi]=ty.dataset.type.split('|').map(Number);
    S.ct={i,gi,mode:'type',n:S.samples[i].groups[gi].cs.length};render();return}
  const co=t.closest('[data-count]');
  if(co){const [i,gi]=co.dataset.count.split('|').map(Number);
    S.ct={i,gi,mode:'count',n:S.samples[i].groups[gi].cs.length};render();return}
  const sc=t.closest('[data-scan]');
  if(sc){const [i,gi]=sc.dataset.scan.split('|').map(Number);openScan(i,gi);render();return}
  const s1=t.closest('[data-scan1]');
  if(s1){const {i,gi}=at(s1.dataset.scan1);openScan(i,gi);render();return}
  const ct=t.closest('[data-ct]'); if(ct){S.ct.t=ct.dataset.ct;S.ct.vol=null;render();return}
  const cv=t.closest('[data-cv]'); if(cv){S.ct.vol=cv.dataset.cv;render();return}
  const pq=t.closest('[data-pq]');
  if(pq){S.ct.n=Math.max(1,Math.min(12,S.ct.n+ +pq.dataset.pq));render();return}
  const tg=t.closest('[data-tgt]'); if(tg){S.scan.target=+tg.dataset.tgt;S.scanErr=null;render();return}

  /* ── adjudication ── */
  const col=t.closest('[data-collect]');
  if(col){const {c}=at(col.dataset.collect);c.st='ok';render();toast(`${c.bc} collected`);return}
  const rj=t.closest('[data-reject]');
  if(rj){const {i,c}=at(rj.dataset.reject);
    S.modal={i};S.mChips=[c.bc];S.mStatus='Rejected';S.mReason='Sample contaminated';render();return}
  const rv=t.closest('[data-revert]');
  if(rv){const {c}=at(rv.dataset.revert);c.st=null;delete c.why;render();
    toast('Status reverted to pending');return}

  const sa=t.closest('[data-selall]');
  if(sa){const i=+sa.dataset.selall,cs=sCs(S.samples[i]).filter(c=>canJudge(c)&&!c.st);
    const all=cs.length&&cs.every(c=>S.sel.has(cKey(i,c)));
    cs.forEach(c=>all?S.sel.delete(cKey(i,c)):S.sel.add(cKey(i,c)));render();return}
  const se=t.closest('[data-sel]');
  if(se){const k=se.dataset.sel;S.sel.has(k)?S.sel.delete(k):S.sel.add(k);render();return}
  const ch=t.closest('[data-chip]'); if(ch){S.mChips.splice(+ch.dataset.chip,1);render();return}

  const a=t.closest('[data-act]'); if(!a)return;
  const k=a.dataset.act;
  if(k==='legends'){S.legends=!S.legends;render()}
  else if(k==='nonAnimal'){S.nonAnimal=!S.nonAnimal;render();
    toast(S.nonAnimal?'Showing non-animal requests':'Showing animal requests')}
  else if(k==='closeSheet'){S.sheet=false;S.selMode=false;S.sel=new Set();render()}
  else if(k==='startSel'){S.selMode=true;S.sel=new Set();render()}
  else if(k==='cancelSel'){S.selMode=false;S.sel=new Set();render()}
  else if(k==='selectAll'){selectAll();render()}
  else if(k==='bulkCollect'){const n=S.sel.size;if(!n){toast('Select a container first');return}
    bulk('ok');render();toast(`${n} container${n===1?'':'s'} collected`)}
  else if(k==='bulkReject'){if(!S.sel.size){toast('Select a container first');return}
    S.modal={bulk:true,i:0};S.mChips=[...S.sel].map(x=>x.split('|')[1]);S.mStatus='Rejected';render()}
  else if(k==='closeModal'){S.modal=null;S.ct=null;render()}
  else if(k==='closeScan'){const n=S.scanLog.length;S.scan=null;S.scanLog=[];S.scanErr=null;render();
    if(n)toast(`${n} barcode${n===1?'':'s'} mapped`)}
  else if(k==='clrScanErr'){S.scanErr=null;render()}
  else if(k==='cycleStatus'){S.mStatus=S.mStatus==='Rejected'?'Collected':'Rejected';render()}
  else if(k==='cycleReason'){const i=REASONS.indexOf(S.mReason);
    S.mReason=REASONS[(i+1)%REASONS.length];render()}
  else if(k==='cycleAnimal'){const list=['Asian Lion · 87546/24','Asian Lion · 87547/24',
    'Asian Lion · 87548/24','Asian Lion · 87549/24','Asian Lion · 87550/24'];
    const i2=list.indexOf(S.scan.animal||list[0]);S.scan.animal=list[(i2+1)%list.length];render()}
  else if(k==='ctSave'||k==='ctPrint'){
    const {i,gi,mode,n}=S.ct,s=S.samples[i];
    const sug=SUGGEST[s.n]||['Sterilised Container','30 ml'];
    const tt=S.ct.t||(gi>=0?s.groups[gi].t:null)||sug[0];
    const cat=CAT.find(x=>x.t===tt)||CAT[0];
    const vv=S.ct.vol||(gi>=0&&mode!=='type'?s.groups[gi].vol:null)||cat.vols[0];
    let g;
    if(gi>=0){g=s.groups[gi];
      if(mode!=='count'){g.t=tt;g.vol=vv}
      if(mode!=='type'){
        const mapped=g.cs.filter(c=>c.bc).length;
        if(n<mapped){toast('Remove the barcodes first');return}
        while(g.cs.length<n)g.cs.push(cn(null));
        if(g.cs.length>n)g.cs=g.cs.filter(c=>c.bc).concat(
          g.cs.filter(c=>!c.bc).slice(0,Math.max(0,n-mapped)));}
    } else {g={t:tt,vol:vv,cs:Array.from({length:n},()=>cn(null))};s.groups.push(g);}
    if(k==='ctPrint'){g.cs.forEach(c=>{if(!c.bc){c.printed=true;c.printedHere=true;c.lab=true;
      c.pkg=S.pkgView==='all'?'PKG-250064':S.pkgView}});}
    S.ct=null;render();
    toast(k==='ctPrint'?`${n} barcode${n===1?'':'s'} printed for ${tt} — stick and scan them`
      :mode==='type'?`Container type set to ${tt}`:`${n} container${n===1?'':'s'} recorded`)}
  else if(k==='simScan'){acceptScan(newBc());render()}
  else if(k==='manualBc'){acceptScan(newBc());render();if(!S.scanErr)toast('Barcode entered manually')}
  else if(k==='simBad'){
    const kinds=[
      {t:'Barcode belongs to another request',d:'BC15679900 is mapped to LT - 00456/26. Bag it back up and check the label.'},
      {t:'Barcode not recognised',d:'BC99900012 was never issued by the system. Print a replacement, or map it to an expected container.'},
      {t:'Barcode already mapped',d:'BC15678901 is already on a container in this request.'}];
    S.scanErr=kinds[(S.scanErrN=((S.scanErrN||0)+1))%3];render()}
  else if(k==='doUpdate'){
    const st=S.mStatus==='Rejected'?'no':'ok';
    if(S.modal.bulk){const n=S.sel.size;bulk(st);S.modal=null;render();
      toast(`${n} container${n===1?'':'s'} ${st==='no'?'rejected':'collected'}`);return}
    let n=0;
    S.samples[S.modal.i].groups.forEach(g=>g.cs.forEach(c=>{
      if(c.bc&&S.mChips.includes(c.bc)){c.st=st;if(st==='no')c.why=S.mReason;n++}}));
    S.modal=null;render();
    toast(`${n} container${n===1?'':'s'} ${st==='no'?'rejected · '+S.mReason:'collected'}`)}
});
document.getElementById('scrim').addEventListener('click',()=>{S.sheet=false;render()});

document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('ver2'))return;

  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){

  if(e.key==='Escape'&&S.vmenu){S.vmenu=false;render()}
  if(S.lv&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();stepRow(e.key==='ArrowDown'?1:-1)}});

  return pick.map(k=>{

    for(let t=0;t<nT;t++){const [ty,vo]=cat[t];const cs=[];const nc=1+Math.floor(R()*3);

function dView(c,dept){
  if(c.st==='rejected')return {mode:'mute',label:'Rejected by lab'};
  if(c.st!=='collected')return {mode:'mute',label:c.ship};
  if(c.loc===dept){
    if(c.dst==='received')return {mode:'ok',label:'Received'};
    if(c.dst==='rejected')return {mode:'no',label:'Rejected'};
    if(c.dst==='transfer')return {mode:'act',label:`In Transfer • from ${c.from} to ${dept}`,xfer:true};
    return {mode:'act',label:'Collected'};}
  if(c.prev===dept)return {mode:'sent',label:`Transferred to ${c.loc}`};

  return {mode:'mute',label:`With ${c.loc} Department`};

const TABS=[['pending','Pending'],['completed','Completed'],['cancelled','Cancelled'],['all','All']];
function rowsFor(){
  const dept=V.view==='dept';
  let rows=(dept?listRows():REQS).filter(r=>V.na?r.kind==='enc':r.kind!=='enc');
  const counts={};TABS.forEach(([k])=>counts[k]=k==='all'?rows.length:rows.filter(r=>r.status===k).length);
  let list=V.tab==='all'?rows:rows.filter(r=>r.status===V.tab);
  if(V.tab==='completed'&&!dept)list=list.filter(r=>V.ctab==='pa'?!r.authorised:r.authorised);
  const q=V.q.trim().toLowerCase();
  if(q)list=list.filter(r=>[r.id,r.aaid,r.uaid,r.by,r.site,r.enc].some(x=>x&&String(x).toLowerCase().includes(q)));
  if(V.flt.urgent)list=list.filter(r=>r.flag);
  if(V.flt.rejected)list=list.filter(r=>recCounts(r).rej>0);
  if(V.flt.pool)list=list.filter(r=>r.kind==='pool');
  const naCount=(dept?listRows():REQS).filter(r=>r.kind==='enc').length;
  return {list,counts,naCount,comp:{pa:rows.filter(r=>r.status==='completed'&&!r.authorised).length,au:rows.filter(r=>r.status==='completed'&&r.authorised).length}};
}

}
function chip(r,kind){
  const dept=V.view==='dept';
  let done,tot,arr,lg;
  if(kind==='s'){
    if(dept){const d=V.dall?DEPTS.map(x=>deptCounts(r,x)).reduce((a,b)=>{for(const k in b)a[k]=(a[k]||0)+b[k];return a},{}):deptCounts(r,V.dept);done=d.rec;tot=d.tot;arr=[d.rec,d.rej,d.tr,d.aw];lg=['Received','Rejected','In Progress','Pending'];}
    else{const c=recCounts(r);done=c.col;tot=c.tot;
      /* AMBIGUOUS in Figma: read as In Progress = shipped and waiting at reception, Pending = not shipped by the clinic yet */
      arr=[c.col,c.rej,allC(r).filter(x=>x.st==='pending'&&x.ship==='Transferred').length,allC(r).filter(x=>x.st==='pending'&&x.ship!=='Transferred').length];
      lg=['Collected','Rejected','In Progress','Pending'];}

function cwPop(r,dept){
  const d=D(r);const ss=dept?d.samples.filter(s=>inDept(s,V.dept)):d.samples;
  const nC=ss.reduce((n,s)=>n+sC(s).length,0);
  return `<div class="x-cwp" style="top:54px;left:24px" data-v="noop">
    <div class="hd"><div class="t">${J.tube}Container Wise Sample Status</div>
      <div class="lg"><span><i style="background:#37BD69"></i>${dept?'Received':'Collected'}</span><span><i style="background:#FA6140"></i>Rejected</span>${dept?'':'<span><i style="background:#fff"></i>Pending</span>'}</div></div>
    <div class="bd"><div class="sm">${ss.length} Samples • ${nC} containers</div>
    ${ss.map(s=>{const cs=sC(s);let a,b,c,lab,col;
      if(dept){const mine=cs.filter(x=>x.loc===V.dept&&x.st==='collected');a=mine.filter(x=>x.dst==='received').length;b=mine.filter(x=>x.dst==='rejected').length;c=null;
        lab=a&&a===mine.length?'Received':b&&b===mine.length?'Rejected':a||b?'In-progress':'Pending';}
      else{a=cs.filter(x=>x.st==='collected').length;b=cs.filter(x=>x.st==='rejected').length;c=cs.filter(x=>x.st==='pending').length;
        const st=sampleState(s);lab={collected:'Collected',rejected:'Rejected',inprogress:'In-progress',pending:'Pending'}[st];}
      col={Collected:'#37BD69',Received:'#37BD69',Rejected:'#FA6140','In-progress':'#E4B819',Pending:'#839D8D'}[lab];
      return `<div class="r"><span><span class="n">${s.name} • <em style="color:${col}">${lab}</em></span><span class="s">${cs.length} containers</span></span>
        <span class="x-pills"><span class="q c">${a}</span><span class="q rj">${b}</span>${c===null?'':`<span class="q n">${c}</span>`}</span></div>`}).join('')}
    </div></div>`;
}
function matchC(s,g,c,dept){
  const q=V.sq.trim().toLowerCase();
  if(q&&![s.name,g.type,cName(c)].some(x=>String(x).toLowerCase().includes(q)))return false;
  if(!V.sflt.size)return true;
  if(dept)return c.loc===V.dept&&c.st==='collected'&&V.sflt.has(c.dst);
  return V.sflt.has(c.st)||(V.sflt.has('unscanned')&&!c.id);
}
function selectable(c,dept){return dept?(c.loc===V.dept&&c.st==='collected'&&(c.dst==='await'||c.dst==='transfer')):(c.st==='pending'&&!!c.id);}
function ckState(cs){const on=cs.filter(c=>V.sel.has(c.cid)).length;return on===0?'':on===cs.length?'on':'part';}
function ckBox(state,v,dis){return `<button class="x-ck ${state} ${dis?'dis':''}" ${dis?'disabled':''} data-v="${v}" role="checkbox" aria-checked="${state==='on'}">${state==='on'?FIG.chk:state==='part'?FIG.part:FIG.unchk}</button>`;}

function recCard(r,s){

  if((V.sq||V.sflt.size)&&!vis.some(x=>x.cs.length))return '';

  const selAble=V.sel?sC(s).filter(c=>selectable(c,false)):[];

    <div class="hd">${V.sel?`<span class="ck">${ckBox(ckState(selAble),'ck:s:'+s.sid,!selAble.length)}</span>`:''}
      <span style="min-width:0"><span class="n">${s.name} - ${s.vol}</span>
        <button class="t" data-v="dtests:${s.sid}">${s.tests.length} Tests ${J.chr}</button></span>

    </div>
    ${vis.map(({g,cs},gi)=>{if((V.sq||V.sflt.size)&&!cs.length)return '';

      ${cs.map(c=>recRow(s,g,gi,c)).join('')}`}).join('')}
  </div>`;
}
function recRow(s,g,gi,c){
  const R=ro();
  if(c.st==='collected'||c.st==='rejected'){
    const ok=c.st==='collected';
    return `<div class="x-cr ${ok?'ok':'no'} ${R||V.sel?'':'click'}" ${R||V.sel?'':`data-v="edit:${c.cid}" title="Edit sample"`}>

function nextSlot(sid){const s=findS(sid);for(const g of s.groups)for(const c of g.cs)if(c.st==='pending'&&!c.id)return c.cid;return null;}
function mapBarcode(cid,code){
  const k=V.dk;code=String(code||'').trim().toUpperCase();
  if(!code)return;
  if(!/^(SMP|BC)[-A-Z0-9/]{4,}$/.test(code)){k.err={cid,msg:`“${code}” is not a lab barcode. Barcodes start with SMP or BC.`};k.focus=cid;render();return;}
  const all=allC(cur());const dup=all.find(c=>c.id===code&&c.cid!==cid);
  if(dup){k.err={cid,msg:`${code} is already on another container in this request.`};k.focus=cid;render();return;}
  const x=findC(cid);const was=x.c.id;x.c.id=code;x.c.label=null;
  if(!was)k.sess[k.sid]=(k.sess[k.sid]||0)+1;
  x.s.log.unshift({k:was?'Edited by lab':'Container scanned at lab',rs:was?'Barcode changed':'',ty:`${x.g.type} • ${x.g.vol}`,ids:[code],...stamp()});
  k.err=null;k.edit=null;k.focus=nextSlot(k.sid);render();
}

/* ═════════ actions ═════════ */
function log(s,e){s.log.unshift(Object.assign({},stamp(),e));}
const tyLine=cs=>{const by={};cs.forEach(x=>{const k=x.g.type+' • '+x.g.vol.replace(' ','');by[k]=(by[k]||0)+1});
  return Object.entries(by).map(([k,n])=>`<b>${n}</b> ${k}`).join(' | ');};
function collect(cids,f){
  const xs=cids.map(findC).filter(Boolean);
  xs.forEach(({g,c})=>{c.st='collected';c.reason='';c.note=f?f.note:'';c.cdate=f?fmtD(f.date):TODAY;c.ctime=f?fmtT(f.time):nowTime();
    c.loc=g.dept;c.dst='await';c.from=null;c.prev=null;});
  bySample(xs).forEach(([s,list])=>log(s,{k:'Collected by lab',ty:tyLine(list),raw:1,ids:list.map(x=>x.c.id),note:f&&f.note}));
  return xs.length;
}
function rejectC(cids,f){
  const xs=cids.map(findC).filter(Boolean);
  xs.forEach(({c})=>{c.st='rejected';c.reason=f.reason;c.note=f.note;c.cdate=fmtD(f.date);c.ctime=fmtT(f.time);c.dst='await'});
  bySample(xs).forEach(([s,list])=>log(s,{k:'Rejected by lab',rs:f.reason,ty:tyLine(list),raw:1,ids:list.map(x=>x.c.id),note:f.note}));
  return xs.length;
}
function bySample(xs){const m=new Map();xs.forEach(x=>{if(!m.has(x.s))m.set(x.s,[]);m.get(x.s).push(x)});return [...m.entries()];}
function receive(cids){
  const xs=cids.map(findC).filter(Boolean);
  xs.forEach(({c})=>{c.dst='received';c.dreason=''});
  bySample(xs).forEach(([s,list])=>log(s,{k:`Received at Department : ${V.dept}`,ty:tyLine(list),raw:1,ids:list.map(x=>x.c.id)}));
  return xs.length;
}
function dock_go(){
  const k=V.dk;const f=k.f;let msg='';
  if(k.t==='rnote'){const t=D(cur()).tests.find(x=>x.tid===k.tid);RX(t).notes[k.key]=f.note.trim();V.dk=null;render();toast(k.o?'Notes updated':'Notes added');return;}
  if(k.t==='addt'){const r=cur(),d=D(r);let n=0;k.picked.forEach(x=>{const [dp,nm]=x.split('|'),sp=(TESTS_LIB[dp].find(z=>z[0]===nm)||[])[1]||'';const t={dept:dp,name:nm,spec:sp,st:'p'};d.tests.push(t);d.samples.forEach(s=>{if((SPEC_TESTS[s.kind]||[]).includes(dp))s.tests.push(t)});n++});V.dk=null;render();toast(`${n} test${n===1?'':'s'} added to ${r.id.replace(/\s/g,'')}`);return;}
  if(k.t==='reject'){const n=rejectC(k.cids,f);msg=n>1?`${n} containers rejected · ${f.reason}`:`${cName(findC(k.cids[0]).c)} rejected · ${f.reason}`;V.sel=null;}
  else if(k.t==='status'){const n=f.status==='Collected'?collect(k.cids,f):rejectC(k.cids,f);msg=`${n} container${n===1?'':'s'} ${f.status==='Collected'?'collected':'rejected'}`;V.sel=null;}
  else if(k.t==='revert'){const x=findC(k.cid);const was=x.c.st;x.c.st='pending';x.c.reason='';x.c.dst='await';
    log(x.s,{k:'Reverted to pending',ty:`${x.g.type} • ${x.g.vol}`,ids:[x.c.id],note:f.note||f.reason});msg=`${cName(x.c)} reverted from ${was} to pending`;}
  else if(k.t==='edit'){const x=findC(k.cid);const tchg=f.date!==k.o.date||f.time!==k.o.time;
    x.c.cdate=fmtD(f.date);x.c.ctime=fmtT(f.time);x.c.note=f.note;if(x.c.st==='rejected')x.c.reason=f.reason;
    log(x.s,{k:'Edited by lab',rs:tchg?'Collection time edited':'Details edited',ty:`${x.g.type} • ${x.g.vol}`,ids:[x.c.id],note:f.note});msg=`${cName(x.c)} updated`;}
  else if(k.t==='request'){const s=findS(k.sid);
    if(!(+f.vol>0)){k.err={vol:'Enter the volume the clinic should send.'};render();return;}
    const was=!!s.requested;const st=stamp();
    s.requested={reason:f.reason,vol:f.vol,unit:f.unit,note:f.note,by:'Jordan Snow',at:`${st.date} • ${st.time}`,cont:k.cont||null};
    log(s,{k:`Requested Sample - ${f.vol}${f.unit}`,ty:k.cont||s.groups.map(g=>`${g.type} • ${g.vol}`).join(', '),note:f.note||f.reason,plainTy:1});
    msg=was?`Sample request for ${s.name} updated`:`${s.name} requested again from the clinic · ${f.vol} ${f.unit}`;}
  else if(k.t==='count'){const s=findS(k.sid);const n=+f.vol;
    if(k.mode==='add'){k.types.forEach(([t,v])=>{let g=s.groups.find(x=>x.type===t&&x.vol===v);
        if(!g){g=G(t,v,[]);s.groups.push(g);}
        for(let i=0;i<n;i++)g.cs.push(C({label:'Container '+(g.cs.length+1),ship:'To Transfer',loc:g.dept,cid:'c'+(_cid++)}));});
      log(s,{k:'Containers added by lab',ty:k.types.map(([t,v])=>`<b>${n}</b> ${t} • ${v.replace(' ','')}`).join(' | '),raw:1});
      toast(`${n*k.types.length} container${n*k.types.length===1?'':'s'} added to ${s.name} — scan them now`);
      openDock({t:'scan',sid:k.sid,sess:{},focus:nextSlot(k.sid)});return;}
    toast(`${n} barcode label${n===1?'':'s'} sent to the printer for ${s.name}`);
    if(nextSlot(k.sid)){openDock({t:'scan',sid:k.sid,sess:{},focus:nextSlot(k.sid)});return;}}
  else if(k.t==='addc'){openDock({t:'count',sid:k.sid,mode:'add',types:[...k.picked].map(x=>x.split('|')),f:{vol:'1'}});return;}
  else if(k.t==='dreject'){const xs=k.cids.map(findC);xs.forEach(({c})=>{c.dst='rejected';c.dreason=f.reason;c.note=f.note});
    bySample(xs).forEach(([s,l])=>log(s,{k:`Rejected by Department : ${V.dept}`,rs:f.reason,ty:tyLine(l),raw:1,ids:l.map(x=>x.c.id),note:f.note}));
    msg=xs.length>1?`${xs.length} containers rejected by ${V.dept}`:`${cName(xs[0].c)} rejected by ${V.dept}`;V.sel=null;}
  else if(k.t==='drevert'){const x=findC(k.cid);const was=x.c.dst;x.c.dst=x.c.from?'transfer':'await';x.c.dreason='';
    log(x.s,{k:'Reverted to pending',ty:`${x.g.type} • ${x.g.vol}`,ids:[x.c.id],note:f.note||f.reason});msg=`${cName(x.c)} reverted from ${was} to pending`;}
  else if(k.t==='xfer'){const xs=k.cids.map(findC);
    xs.forEach(({c})=>{c.prev=V.dept;c.from=V.dept;c.loc=f.dept;c.dst='transfer';});
    bySample(xs).forEach(([s,l])=>log(s,{k:`Transferred from ${V.dept} Department to ${f.dept}`,ty:tyLine(l),raw:1,ids:l.map(x=>x.c.id)}));
    msg=xs.length>1?`${xs.length} containers transferred to ${f.dept} — they show there as In Transfer`:`${cName(xs[0].c)} transferred to ${f.dept} — it shows there as In Transfer`;}
  V.dk=null;render();if(msg)toast(msg);
}

function resInput(t){const ds=t.dataset;if(!ds)return false;const r=cur();if(!r)return false;

  if(ds.vu){const [id,k]=ds.vu.split('|');const x=ft(id);if(x)RR(x).units[k]=t.value;return true;}
  if(ds.vm){const [id,k]=ds.vm.split('|');const x=ft(id);if(x){const R=RR(x);(R.mach=R.mach||{})[k]=t.value;}return true;}
  if(ds.vsel==='rk'){V.rk=t.value;render();return true;}
  if(ds.vi==='rq'){V.rq=t.value;render();return true;}
  const C=V.cult&&ft(V.cult)?CC(ft(V.cult)):null;if(!C)return false;const f=C.st[C.stage].f;

  if(ds.vco){const [i,k]=ds.vco.split('|');const o=f.orgs[+i];const old=o.org;o[k]=t.value;
    if(k==='org'&&old&&old!==t.value)Object.keys(f.ast).filter(z=>z.startsWith(old+'|')).forEach(z=>delete f.ast[z]);
    render();return true;}
  if(ds.vca){const [o,a,k]=ds.vca.split('|');const key=o+'|'+a;f.ast[key]=Object.assign({},f.ast[key],{[k]:t.value});render();return true;}
  return false;}
function onInput(e){

    else if(k==='rmr'){V.rmod.reason=t.value;const b=document.querySelector('[data-v="rmodgo"]');if(b)b.disabled=!t.value.trim();return;}

function onChange(e){

  if(t.dataset&&t.dataset.vat&&V.dk){t.checked?V.dk.picked.add(t.dataset.vat):V.dk.picked.delete(t.dataset.vat);render();return;}
  if(t.dataset&&t.dataset.vup){const r=cur(),kind=t.dataset.vup,A=RPF(r,kind);[...t.files].forEach((f,i)=>{A.unshift({id:'u'+Date.now()+i,name:f.name,pdf:/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name),day:0,by:'Jordan Snow',tm:nowTime(),src:URL.createObjectURL(f),up:true})});render();toast(`${t.files.length} file${t.files.length===1?'':'s'} uploaded`);return;}

  if(t.dataset.vf&&V.dk){V.dk.f[t.dataset.vf]=t.value;if(V.dk.err)V.dk.err=null;render();}
}
function onKey(e){
  const t=e.target;

/* demo: the pending request with the most open tests for a department; receive its containers unless asked not to */
function resDemo(dept,cult,none){const open=r=>D(r).tests.filter(t=>t.dept===dept&&!!isCult(t)===!!cult&&t.st==='p').length;
  const r=REQS.filter(r=>r.status==='pending'&&r.kind!=='enc'&&open(r)>0).sort((a,b)=>open(b)-open(a))[0];
  D(r).tests.filter(t=>t.dept===dept&&!!isCult(t)===!!cult).forEach(t=>{const sm=tSample(r,t);if(!sm)return;
    const mine=sC(sm).filter(c=>c.loc===dept);(mine.length?mine:sC(sm)).forEach(c=>{
    if(none){if(c.dst==='received')c.dst='await';if(c.st!=='collected'){c.st='collected';c.id=c.id||nextSmp();}return;}
    c.st='collected';c.id=c.id||nextSmp();c.dst='received';})});
  return r;}

}

  document.addEventListener('keydown',e=>{if(!h.hidden)onKey(e)});_bound=true;}render();}
return {mount,render,V,REQS,D};
