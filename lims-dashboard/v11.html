<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab Operations Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the lab's version of the species profile. A hero names the lab and its scale, a strip says what needs attention,
   then the same lenses the species app uses: trend, where work is stuck, site > enclosure, species > animal, departments. Summary first, detail as you scroll. */
:root{
  --bg:#EFF5F2;--surface:#FFFFFF;--inset:#F4F9F6;--thead:#DDEBE9;--line:#ECEAE5;--rule:#E9E9EC;
  --ink:#1C1A16;--ink2:#3D3A34;--body:#55524A;--muted:#736E67;--faint:#A9B3AD;
  --brand:#1F515B;--brand-solid:#1F515B;--brand-soft:#DFF0EE;--picker:#839D8D;--link:#006D35;
  --hero-a:#255D68;--hero-b:#16364F;--hero-mut:rgba(255,255,255,.74);--hero-line:rgba(255,255,255,.14);--hero-cell:rgba(255,255,255,.07);
  --k1:#FFE86E;--k2:#52F990;--k3:#00D6C9;
  --c-animal:#00AFD6;--c-non:#FA6140;
  --good:#37BD69;--good-ink:#1F6B45;--good-soft:#E1F9ED;
  --warn:#E4B819;--warn-ink:#8A6D00;--warn-soft:#FCF4AE;
  --crit:#D4553A;--crit-ink:#B8360F;--crit-soft:#FFD3D3;
  --st1:#1F515B;--st2:#00AFD6;--st3:#37BD69;
  --line-a:#37BD69;--line-b:#9FDDB5;
  --rq1:#FCE57E;--rq2:#62D5C9;--rq3:#DB4455;--rqt1:#8A6E00;--rqt2:#16786D;--rqt3:#B8303F;--agl:#3A9E94;--agb:#2E505B;--agb2:#35606D;--agl8:#E8694A;--cnt:#1B3A57;--ln1:#E0AE00;--ln2:#2EB5A6;--ln3:#DB4455;--ts1:#FCE57E;--ts2:#8EC5E8;--ts3:#4A7FA8;--ts4:#62D5C9;--ty1:#2E505B;--ty2:#8DCCC3;--ag1:#C7E6E1;--ag2:#8DCCC3;--ag3:#4FAEA3;--ag4:#2C7D74;--tip:#16364F;
  --f-ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light}


*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--f-ui);color:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* app shell, as in the rest of the lab app */
.app{display:flex;min-height:100vh}
.side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brandm{display:flex;align-items:center;gap:9px;padding:0 4px 16px;color:var(--brand)}
.brandm .lg{width:32px;height:32px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:700;font-size:15px}
.brandm b{display:block;font-size:20px;font-weight:600;letter-spacing:.14em;line-height:1}
.brandm i{display:block;font-style:normal;font-size:8px;letter-spacing:.45em;margin-top:2px}
.sbox{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:4px;margin-bottom:10px;color:var(--muted)}
.sbox input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:12.5px;color:var(--ink2)}
.sbox svg{width:14px;height:14px}
.sgrp{font-size:11px;font-weight:500;color:var(--muted);padding:6px}
.nav{display:flex;align-items:center;gap:10px;min-height:38px;padding:8px 12px;border-radius:4px;font-weight:500;width:100%;font-size:13px;color:var(--body)}
.nav svg{width:16px;height:16px;flex:none}.nav:hover{background:var(--inset)}.nav.on{background:var(--brand-solid);color:#FFFFFF}
.me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--inset);border-radius:6px}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:11px;flex:none}
.me b{display:block;font-size:12.5px;color:var(--ink2);font-weight:600}.me span{font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;padding-inline:24px;padding-block:22px 48px}
.mnav{display:none}
.wrap{max-width:1360px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:600;color:var(--ink2)}
.top .sp{flex:1}
.drange{display:inline-flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden;max-width:100%}
.drange .dic{width:38px;height:38px;display:grid;place-items:center;background:var(--picker);color:#FFFFFF;flex:none}
.drange .dic svg{width:16px;height:16px}
.drange select{border:0;background:transparent;height:36px;padding:0 10px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;min-width:0;max-width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:70;max-width:calc(100% - 32px)}

/* slim hero banner */
.top2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:16px;align-items:stretch}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:22px 24px;color:#FFFFFF;background:linear-gradient(120deg,var(--hero-a) 3%,var(--hero-b) 68%);display:flex;flex-direction:column;align-items:flex-start;gap:22px;min-width:0}
.hlw{position:relative;display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.rep{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0;overflow:hidden}
.rep .rh{display:flex;align-items:center;gap:8px}.rep .sp{flex:1}
.rep .l{font-size:18px;font-weight:600;color:var(--ink);white-space:nowrap}
.rep .go2{font-size:12px;font-weight:600;color:var(--warn-ink);background:var(--warn-soft);border-radius:99px;padding:2px 9px;white-space:nowrap}
.rsc{flex:1;display:flex;align-items:flex-end;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px 0 -2px;padding:0 24px 0 2px;scroll-padding-inline:2px;scrollbar-width:none}.rsc::-webkit-scrollbar{display:none}
.rc{flex:0 0 168px;scroll-snap-align:start;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--inset);border:1px solid var(--rule);text-align:left;min-width:0}
.rc:hover{border-color:var(--brand)}
.rc .rtop{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.rc .rid{font-size:15.5px;font-weight:700;color:var(--brand);white-space:nowrap}
.rc .rsp{font-size:13px;color:var(--ink2)}.rc .rdt{font-size:11.5px;color:var(--muted);flex:none}
.rc b{font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .rd{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:4px;border-top:1px solid var(--rule)}.rc .rd span{font-size:12px;color:var(--muted)}.rc .rd span:last-child{flex:none}
.rc .rd i{width:7px;height:7px;border-radius:50%;flex:none}.rc .rd i.s{background:var(--good)}.rc .rd i.w{background:var(--warn)}
.rbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--inset)}.rbar i{display:block;height:100%}
.rl{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--body)}.rl span{display:inline-flex;align-items:center;gap:6px}.rl i{width:8px;height:8px;border-radius:2px}
.rf{font-size:12px;color:var(--muted)}
.hero::after{content:"";position:absolute;right:-60px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,214,201,.14),transparent);pointer-events:none}
.hl{display:flex;flex-direction:column;gap:4px;position:relative}
.hl h2{font-size:24px;font-weight:600;line-height:1.2}
.hl p{font-size:14px;color:var(--hero-mut);max-width:32ch;line-height:1.5}
.hstats{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hstats>div{padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;text-align:center;border-radius:12px;background:rgba(0,0,0,.14);border:1px solid var(--hero-line)}
.hstats.h2c{display:flex;flex-wrap:wrap;justify-content:flex-end;align-self:flex-end}
.hstats.h2c>div{width:190px;align-items:flex-start;text-align:left;padding:14px 16px}
.hstats span{font-size:12px;color:var(--hero-mut);white-space:nowrap}
.hstats b{font-size:36px;font-weight:700;line-height:1.15}
.hchips{position:relative;display:flex;gap:6px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:99px;background:#FFFFFF;color:#3D3A34;font-size:13px;font-weight:700;white-space:nowrap}

/* attention strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px}
.strip>div{padding:16px 22px;display:flex;flex-direction:column;gap:4px;min-width:0}
.strip>div+div{border-left:1px solid var(--line)}
.strip .l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--body)}
.strip b{font-size:26px;font-weight:700;color:var(--crit)}
.strip b.ok{color:var(--faint)}
.strip b.amb{color:var(--warn-ink)}
.strip span{font-size:12.5px;color:var(--muted)}

/* cards */
.r2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.r2.lead{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}.r2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.cmp table{min-width:0}.cmp td,.cmp th{padding:12px 14px}.card>.note{margin-top:-8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ch{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ch h3{font-size:18px;font-weight:600;color:var(--ink)}
.ch .meta{font-size:13px;color:var(--muted)}
.ch .sp{flex:1}
.sub{font-size:13px;color:var(--muted)}.sub b{color:var(--crit-ink);font-weight:600}
.seg{display:inline-flex;padding:4px;border-radius:99px;background:var(--inset);gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:500;color:var(--body)}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(20,40,34,.12)}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--body)}
.lgd span{display:inline-flex;align-items:center;gap:7px}
.lgd i{width:14px;height:3px;border-radius:2px}

/* trend */
.trend svg{width:100%;height:auto;display:block;overflow:visible}
.trend .gl{stroke:var(--rule);stroke-dasharray:4 4}
.trend .ax{font-size:11px;fill:var(--muted)}
.trend .vl{font-size:11px;font-weight:700;fill:var(--good-ink)}

/* distribution blocks (as in Length of Stay) */
.blocks{display:flex;gap:4px}
.blocks>div{display:flex;flex-direction:column;gap:6px;min-width:44px}
.blocks .bk{height:28px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#FFFFFF}
.blocks .bl{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}
.split{display:flex;gap:4px}
.split>div{display:flex;flex-direction:column;gap:6px;min-width:96px}
.split .bk{height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#FFFFFF;padding:0 8px;white-space:nowrap;overflow:hidden}
.split .bl{font-size:12px;color:var(--muted);text-align:center}
.mini{display:flex;flex-direction:column;gap:18px}
.mini h4{font-size:15px;font-weight:600;color:var(--ink)}
.mini .h{display:flex;flex-direction:column;gap:4px}

/* tables, as in Housing / Overdue Preventive Care */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
th{background:var(--thead);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--body);text-align:right;padding:14px 16px;white-space:nowrap;position:relative}
th:first-child{text-align:left}
th+th::before{content:"";position:absolute;left:0;top:30%;bottom:30%;border-left:1px solid rgba(0,0,0,.08)}
td{padding:14px 16px;border-top:1px solid var(--rule);text-align:right;font-size:14px;color:var(--ink2);white-space:nowrap}
td:first-child{text-align:left;white-space:normal}
tbody tr:hover td{background:var(--inset)}
td .nm{font-weight:600;color:var(--ink2)}
td .sci{display:block;font-size:12.5px;font-style:italic;color:var(--muted);font-weight:400}
td .sub2{display:block;font-size:12.5px;color:var(--muted)}
td.z{color:var(--faint)}
td.hot{color:var(--crit-ink);font-weight:600}
td.tot{color:var(--link);font-weight:700}
td.lft{text-align:left}
.ttl{display:flex;align-items:center;gap:12px}
.ava{width:44px;height:44px;border-radius:10px;background:var(--inset);display:grid;place-items:center;color:var(--brand);flex:none;position:relative}
.ava svg{width:20px;height:20px}
.ava .tg{position:absolute;left:-4px;top:-4px;font-size:9px;font-weight:700;color:#FFFFFF;background:var(--c-animal);border-radius:4px;padding:1px 4px}
.idl{display:flex;flex-direction:column;gap:1px}
.idl b{font-size:14px;font-weight:600;color:var(--brand)}
.idl span{font-size:12.5px;color:var(--body)}
.stg{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600}
.stg.samples{background:var(--crit-soft);color:var(--crit-ink)}
.stg.process{background:var(--brand-soft);color:var(--brand)}
.stg.auth{background:var(--warn-soft);color:var(--warn-ink)}
.ot{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ot .d{width:8px;height:8px;border-radius:50%}
.ot.good{color:var(--good-ink)}.ot.good .d{background:var(--good)}
.ot.warn{color:var(--warn-ink)}.ot.warn .d{background:var(--warn)}
.ot.crit{color:var(--crit-ink)}.ot.crit .d{background:var(--crit)}
.tvt{display:inline-flex;align-items:center;gap:8px}
.tvt .bb{position:relative;width:70px;height:6px;border-radius:99px;background:var(--inset)}
.tvt .bb i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.tvt .bb em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);border-radius:1px}
.more{align-self:flex-start;font-size:14px;font-weight:600;color:var(--link)}
.more:hover{text-decoration:underline}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule)}
.tabs button{padding:0 0 10px;font-size:14.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--link);border-bottom-color:var(--link);font-weight:600}
.rej{display:flex;flex-direction:column;gap:10px}
.rj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.rj .n{color:var(--ink2)}.rj b{color:var(--ink);font-weight:700}
.rj .tr{grid-column:1/-1;height:8px;border-radius:99px;background:var(--inset);overflow:hidden}
.rj .tr i{display:block;height:100%;border-radius:99px;background:var(--crit)}
.note{font-size:12.5px;color:var(--muted)}

/* animal and non-animal boxes inside the requests card */
.tt{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--inset) 60%,var(--surface));border:1px solid var(--rule);min-width:0}
.tt .h{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink2)}
.tt b{margin-top:2px;font-size:22px;line-height:1.05;font-weight:700;color:var(--ink);letter-spacing:-.01em}
/* requests card, top to bottom: totals by status beside the animal and non-animal boxes, then the ageing report */
/* right of the requests card: two empty cards of equal height, content to be decided */
.tcol{display:flex;flex-direction:column;gap:16px;min-width:0}.tcol>.card{flex:1}
/* species-wise and site-wise status beside the requests card; the column takes the requests card's height and each list scrolls */
.tcol{contain:size}.tcol>.card{min-height:0}
@media (max-width:1180px){.tcol{contain:none}.tcol .stl{max-height:280px}}
.stc .lg{display:flex;gap:12px;font-size:12px;color:var(--muted)}.stc .lg span{display:inline-flex;align-items:center;gap:5px}.stc .lg i{width:8px;height:8px;border-radius:50%}
.stl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;margin-right:-10px;padding-right:10px}
.str{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-top:1px solid var(--line)}.str:first-child{border-top:0;padding-top:2px}
.str .h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink2)}.str .h b{font-weight:700;color:var(--cnt)}
.ssb{display:flex;gap:3px;height:8px}.ssb i{display:block;height:100%;border-radius:99px;min-width:8px}
/* tests card: four status counts on top, then three donut cards (completed, in progress, pending) split by whether each test is within its target turnaround */
.tsx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tsx>div{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--inset) 60%,var(--surface))}
.tsx .h{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}.tsx .h i{width:8px;height:8px;border-radius:50%;flex:none}
.tsx b{font-size:20px;font-weight:700;color:var(--cnt)}
/* By department: the status counts sit in one row, no boxes, a single rule between each */
[aria-label="By department"] .tsx{gap:0}
[aria-label="By department"] .tsx>div{background:none;border-radius:0;padding:4px 16px}
[aria-label="By department"] .tsx>div:first-child{padding-left:0}
[aria-label="By department"] .tsx>div+div{border-left:1px solid var(--rule)}
.tdn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;margin-top:6px}
.tdc{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 18px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,40,48,.04),0 8px 24px rgba(16,40,48,.08);min-width:0}
.tdc h4{align-self:flex-start;font-size:14px;font-weight:600;color:var(--ink2)}
.tdc .ring{position:relative;width:min(118px,100%);aspect-ratio:1}.tdc .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tdc .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--ink)}
.tdc .ring.semi{width:100%;max-width:240px;aspect-ratio:2/1}.tdc .ring.semi svg{transform:none;display:block}.tdc .ring.semi b{inset:auto 0 0 0;display:block;text-align:center;font-size:30px;line-height:.74;bottom:10px}
.tdc .lg{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--body);width:100%}
.tdc .lg span{display:flex;align-items:center;gap:6px}.tdc .lg i{width:8px;height:8px;border-radius:2px;flex:none}.tdc .lg b{margin-left:auto;color:var(--ink)}
@media (max-width:640px){.tsx{grid-template-columns:repeat(2,minmax(0,1fr))}.tdn{grid-template-columns:minmax(0,1fr)}}
/* sites card: a headline (requests from sites, change, share) then four tiles, problems on top and where on the bottom */
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sh .n{font-size:40px;line-height:1;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.sh .t{font-size:13.5px;color:var(--ink2)}
.dl{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.dl.up{color:var(--good-ink);background:var(--good-soft)}.dl.dn{color:var(--crit-ink);background:var(--crit-soft)}
.tcol>.sites{flex:1}
/* the chart takes whatever height the card has left, so the card fills its column without a gap at the bottom */

/* requests from sites over the period, in the style of a trend chart: stacked areas, pending on the bottom and completed on top (top edge = completed + pending), as rolling 7-day totals,
   faint bars of each day's total behind them, light gridlines. SVG draws lines and bars; guide, dots and tooltip are HTML per-day columns */
.slg{display:flex;justify-content:flex-end;gap:14px;font-size:12px;color:var(--body)}.slg span{display:inline-flex;align-items:center;gap:6px}.slg i{width:8px;height:8px;border-radius:50%}
.slc{display:grid;grid-template-columns:24px minmax(0,1fr);row-gap:6px;margin-top:6px}
.slc .ya{position:relative;height:160px;font-size:10.5px;color:var(--faint)}.slc .ya span{position:absolute;right:6px;transform:translateY(-50%)}
.slc .pa{position:relative;height:160px}
.slc .gl{position:absolute;left:0;right:0;border-top:1px solid var(--rule);opacity:.7}
.slc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slc .hv{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.slc .c{position:relative;outline:none}
.slc .c::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--muted);opacity:0}
.slc .c:hover::before,.slc .c:focus-visible::before{opacity:.8}
.slc .dt{position:absolute;left:50%;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);box-sizing:content-box;opacity:0}
.slc .c:hover .dt,.slc .c:focus-visible .dt{opacity:1}
.slc .tp{position:absolute;top:4px;left:calc(50% + 10px);width:max-content;min-width:150px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 8px 22px rgba(0,0,0,.12);font-size:12.5px;color:var(--body);opacity:0;pointer-events:none;transition:opacity .1s;z-index:3;padding:8px 12px 6px}
.slc .c.r .tp{left:auto;right:calc(50% + 10px)}
.slc .c:hover .tp,.slc .c:focus-visible .tp{opacity:1}
.slc .tp .th{display:block;margin-bottom:4px;font-weight:600;color:var(--ink2)}
.slc .tp .tr{display:flex;align-items:center;gap:7px;padding:2px 0}.slc .tp .tr i{width:7px;height:7px;border-radius:50%}.slc .tp .tr b{margin-left:auto;padding-left:14px;color:var(--ink)}
.slc .xa{grid-column:2;position:relative;height:14px;font-size:11px;color:var(--muted)}.slc .xa span{position:absolute;transform:translateX(-50%);white-space:nowrap}.slc .xa span:first-child{transform:none;left:0!important}.slc .xa span:last-child{transform:none;left:auto!important;right:0}
.sh .vs{font-size:12px;color:var(--muted)}
/* separate selectable chips: outlined when off, solid brand when on */
.chp{display:flex;gap:8px}
.chp button{height:30px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--body)}

.rhalf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rqtop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px;align-items:stretch;margin-bottom:14px}
.dflt{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;color:#2E7D46;background:var(--surface)}
.dflt:hover{background:var(--inset)}.dflt:focus-visible{outline:2px solid var(--st3);outline-offset:2px}.dflt svg{width:20px;height:20px}
.ch .rpgo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#2E7D46;flex:none;margin-left:-8px}.ch .rpgo:hover{background:#EEF5F1}.ch .rpgo svg{width:18px;height:18px}
.dmd{position:relative;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin:2px 0 -2px;cursor:pointer;border-radius:6px}
.dmd span{font-size:16px;font-weight:600;color:#44544A}.dmd svg{width:18px;height:18px;color:var(--ink2)}
.dmd select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.dmd:focus-within{outline:2px solid var(--st3);outline-offset:3px}
.dpw{position:relative;min-width:0;margin:-4px 0 6px}
.dpc{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none;scroll-snap-type:x proximity}
.dpc::-webkit-scrollbar{display:none}
.dpc button{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;position:relative}
.dpc button{height:36px;padding:0 16px;border-radius:8px;border-color:transparent}
.dpc button:not(.on){font-size:14px;font-weight:600;color:#4A544E;background:#E8F4F2}
.dpc button:not(.on):hover{background:#DCEDEA}.dpc button.on{background:#243F58;border-color:#243F58;color:#fff;font-weight:600}
.dpd{width:9px;height:9px;border-radius:2px;background:var(--rq1);box-shadow:inset 0 0 0 1px #E4B819;flex:none}
.dpc button.on .dpd{background:var(--rq1);box-shadow:none}
.vh2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dpc button.dhot{overflow:visible;transition:background-color .2s,color .2s}
.dpc button.dhot::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s;
 background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%),linear-gradient(180deg,rgba(250,97,64,0) 15%,rgba(250,97,64,.2) 100%);
 background-size:260% 100%,100% 100%;background-position:130% 0,0 0}
/* filled chips: on hover the fill warms to a soft coral and the dot pulses, instead of the old outline + shine */
.dpc button.dhot::after{display:none}
.dpc button.dhot:not(.on):hover{border-color:transparent;background:#FDF5D3;color:#6E5B0C}
.dpc button.dhot:not(.on):hover .dpd{animation:dpp 1.3s ease-out infinite}
@keyframes dpp{0%{box-shadow:0 0 0 0 rgba(228,184,25,.45)}100%{box-shadow:0 0 0 6px rgba(228,184,25,0)}}
.dpc button.dhot:not(.on):hover::after{opacity:1;animation:dpsh 1.8s ease-in-out infinite}
@keyframes dpsh{0%{background-position:130% 0,0 0}100%{background-position:-30% 0,0 0}}
@media (prefers-reduced-motion:reduce){.dpc button.dhot:not(.on):hover .dpd{animation:none}}
#tipx{position:fixed;z-index:60;pointer-events:none;background:#fff;border-radius:6px;padding:8px 11px;font-size:12.5px;color:var(--body);line-height:1.35;white-space:nowrap;
 box-shadow:0 8px 24px -6px rgba(31,81,91,.3),0 0 0 1px #E1EAE5;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s}
#tipx.on{opacity:1;transform:none}#tipx b{font-weight:600}

.rqi.on{background:color-mix(in srgb,var(--rule) 55%,var(--inset))}.rqi.on .rqbar{background:color-mix(in srgb,var(--rule) 90%,var(--ink))}

.rqbar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}

.agbox{border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:8px;padding:16px 18px 14px;min-width:0;background:var(--surface);transition:border-color .2s,box-shadow .2s}
.agbox:hover,.agbox:focus-within{box-shadow:0 1px 2px rgba(16,40,48,.04),0 8px 24px rgba(16,40,48,.08)}

.agc .v{font-size:15px;font-weight:600;color:var(--ink2)}.agc .bar{width:min(72px,50%);border-radius:7px 7px 0 0;background:var(--agb)}
.agc .col.late .v{color:var(--agl8)}.agc .col.late .bar{background:var(--agl8)}.agc .col.mid .bar{background:var(--agb2)}
.agc .tp{position:absolute;bottom:calc(var(--h) + 36px);left:50%;transform:translateX(-50%);width:max-content;max-width:170px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.1);font-size:12.5px;color:var(--ink2);line-height:1.4;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2}

/* pill dropdown filter (shared): pill trigger, green border + up chevron when open, white menu card, selected row tinted green */
